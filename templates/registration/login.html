{% extends "base.html" %}{% block title %}Sign in · ExpenseTracker{% endblock %}
{% block auth %}
<div class="authcard">
  <div class="brand dark"><span class="brandmark">₨</span><span>Expense<em>Tracker</em></span></div>
  <h1>Welcome back</h1><p class="muted">Sign in to see your finances.</p>
  <form method="post" class="stack">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary wide">Sign in</button>
  </form>
  <p class="muted center">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
